<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>musicislife-contact</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <section class="contact-section" id="contact">
    <div class="contact-container">

        <h2>Contact us</h2>
        <p class="contact-desc">หากมีคำแนะนำ ต้องการให้เพิ่มเพลง หรือพบปัญหา สามารถติดต่อเราได้ที่นี่</p>

        <div class="contact-content">
            
            <!-- Left info panel -->
            <div class="contact-info">
                <h3>Get in touch</h3>
                <p><i class="fa-solid fa-envelope"></i> musicislife@example.com</p>
                <p><i class="fa-solid fa-phone"></i> 099-123-4567</p>
                <p><i class="fa-solid fa-location-dot"></i> Bangkok, Thailand</p>

                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
                </div>
            </div>

            <!-- Right form -->
            <form class="contact-form">
                <label>ชื่อ *</label>
                <input type="text" placeholder="กรอกชื่อของคุณ" required>

                <label>Email *</label>
                <input type="email" placeholder="example@mail.com" required>

                <label>ข้อความ *</label>
                <textarea rows="5" placeholder="พิมพ์ข้อความของคุณที่นี่..." required></textarea>

                <button type="submit">ส่งข้อความ</button>
            </form>

        </div>
    </div>
</section>

</body>
</html>
